<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Generar multas')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Generar Multas</h1>
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <form method="post" th:action="@{/multas/sincronizar}" class="card card-body bg-white mb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <span th:text="${'Monto estándar de la junta: $' + montoEstandar}">Monto</span>
                <span class="badge text-bg-warning" th:unless="${#lists.isEmpty(pendientes)}"
                      th:text="${#lists.size(pendientes) + ' inasistencias detectadas'}">Detectadas</span>
            </div>
            <div th:if="${#lists.isEmpty(pendientes)}" class="alert alert-light border mb-0" th:text="#{multa.sinPendientes}">Sin pendientes</div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(pendientes)}">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th scope="col"><span class="visually-hidden">Seleccionar</span></th>
                        <th scope="col">Evento</th>
                        <th scope="col">Socio ausente</th>
                        <th scope="col">Estado</th>
                        <th scope="col" class="monto">Valor multa ($)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inasistencia : ${pendientes}">
                        <td>
                            <input class="form-check-input" type="checkbox" name="seleccion"
                                   th:id="${'seleccion-' + inasistencia.asistenciaId}" th:value="${inasistencia.asistenciaId}"
                                   th:checked="${seleccion == null or #lists.contains(seleccion, inasistencia.asistenciaId)}"
                                   th:disabled="${!puedeAprobar}"
                                   th:attr="aria-label=${'Multar a ' + inasistencia.nombreCompleto}">
                        </td>
                        <td th:text="${inasistencia.tipoEvento.etiqueta + ' · ' + #temporals.format(inasistencia.fecha, 'dd/MM/yyyy')}">Evento</td>
                        <td>
                            <span th:text="${inasistencia.nombreCompleto}">Socio</span>
                            <div class="small text-muted" th:text="${inasistencia.cedula}">Cédula</div>
                        </td>
                        <td><span class="badge bg-danger">AUSENTE</span></td>
                        <td class="monto">
                            <label class="visually-hidden" th:for="${'monto-' + inasistencia.asistenciaId}">Valor</label>
                            <input type="number" step="0.01" min="0.01" class="form-control form-control-sm text-end"
                                   th:id="${'monto-' + inasistencia.asistenciaId}"
                                   th:name="${'monto[' + inasistencia.asistenciaId + ']'}"
                                   th:value="${montos.containsKey(inasistencia.asistenciaId) ? montos.get(inasistencia.asistenciaId) : montoEstandar}"
                                   th:readonly="${!puedeAprobar}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-2">
                <a class="btn btn-outline-dark" th:href="@{/multas}">Volver</a>
                <button type="submit" class="btn btn-verde" th:if="${puedeAprobar and !#lists.isEmpty(pendientes)}">Aprobar y Facturar Multas</button>
            </div>
        </form>
        <section th:unless="${#lists.isEmpty(eventosSinCerrar)}" class="card card-body bg-light">
            <h2 class="h6">Eventos sin registro de asistencia cerrado</h2>
            <ul class="list-unstyled mb-0">
                <li th:each="evento : ${eventosSinCerrar}" class="d-flex flex-wrap justify-content-between gap-2 border-bottom py-1">
                    <span th:text="${evento.tipoEvento.etiqueta + ' · ' + #temporals.format(evento.fecha, 'dd/MM/yyyy') + ' · ' + evento.lugar}">Evento</span>
                    <span class="badge bg-secondary" th:text="#{multa.actaPendiente}">Pendiente</span>
                </li>
            </ul>
        </section>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
