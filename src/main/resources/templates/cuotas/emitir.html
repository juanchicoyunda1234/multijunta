<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Emitir cuotas')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Emitir Cuotas</h1>
        <form method="post" novalidate th:object="${cuotaFormulario}" th:action="@{/cuotas/previa}" class="card card-body bg-white">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}"
                 th:text="${error}">Error</div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="concepto">Concepto</label>
                    <input type="text" class="form-control" id="concepto" th:field="*{concepto}" maxlength="120"
                           placeholder="Ej: Tarifa anual 2026" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{concepto}"></div>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="monto">Monto ($)</label>
                    <input type="number" class="form-control" id="monto" th:field="*{monto}" step="0.01" min="0.01"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{monto}"></div>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="fechaVencimiento">Vencimiento</label>
                    <input type="date" class="form-control" id="fechaVencimiento" th:field="*{fechaVencimiento}"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fechaVencimiento}"></div>
                </div>
                <div class="col-12">
                    <span class="form-label d-block">Aplicar a</span>
                    <div class="form-check form-check-inline" th:each="opcion : ${destinos}">
                        <input class="form-check-input" type="radio" th:field="*{destino}" th:value="${opcion}">
                        <label class="form-check-label" th:for="${#ids.prev('destino')}" th:text="${opcion.etiqueta}">Destino</label>
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('destino')}" th:errors="*{destino}"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="sectorId">Sector (si aplica a un sector)</label>
                    <select class="form-select" id="sectorId" th:field="*{sectorId}" th:errorclass="is-invalid">
                        <option value="">Seleccione</option>
                        <option th:each="sector : ${sectores}" th:value="${sector.id}" th:text="${sector.nombre}">Sector</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{sectorId}"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="socioId">Socio (si aplica a un socio)</label>
                    <select class="form-select" id="socioId" th:field="*{socioId}" th:errorclass="is-invalid">
                        <option value="">Seleccione</option>
                        <option th:each="socio : ${socios}" th:value="${socio.id}"
                                th:text="${socio.apellidos + ' ' + socio.nombres + ' · ' + socio.cedula}">Socio</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{socioId}"></div>
                </div>
            </div>
            <div class="alert alert-info mt-3 mb-0" th:if="${resumen != null}">
                <strong th:text="${resumen}">Resumen</strong>
                <div th:if="${omitidos != null}" th:text="${omitidos}">Omitidos</div>
            </div>
            <div class="d-flex flex-wrap justify-content-end gap-2 mt-3">
                <a class="btn btn-outline-dark" th:href="@{/cuotas}">Cancelar</a>
                <button type="submit" class="btn btn-outline-dark">Vista previa</button>
                <button type="submit" class="btn btn-verde" th:if="${resumen != null}" th:formaction="@{/cuotas}">Confirmar emisión</button>
            </div>
        </form>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
