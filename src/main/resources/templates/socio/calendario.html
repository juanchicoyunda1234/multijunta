<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi calendario')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Mi Panel</h1>
        <ul th:replace="~{fragments/socio :: pestanas(${pestana})}"></ul>
        <h2 class="h6">Turnos de mi sector (próximas 4 semanas)</h2>
        <p th:if="${#lists.isEmpty(turnos)}" class="text-muted" th:text="#{socio.sinTurnos}">Sin turnos</p>
        <div class="table-responsive" th:unless="${#lists.isEmpty(turnos)}">
            <table class="table table-sm align-middle bg-white">
                <thead>
                <tr>
                    <th scope="col">Fecha</th>
                    <th scope="col">Horario</th>
                    <th scope="col">Recurso</th>
                    <th scope="col">Responsable</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="turno : ${turnos}">
                    <td th:text="${#temporals.format(turno.fecha, 'dd/MM/yyyy')}">Fecha</td>
                    <td th:text="${#temporals.format(turno.horaInicio, 'HH:mm') + '–' + #temporals.format(turno.horaFin, 'HH:mm')}">Horario</td>
                    <td th:text="${turno.recurso.nombre}">Recurso</td>
                    <td th:text="${turno.responsable}">Responsable</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
