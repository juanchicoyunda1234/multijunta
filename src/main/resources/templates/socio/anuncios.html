<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Anuncios')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Mi Panel</h1>
        <ul th:replace="~{fragments/socio :: pestanas(${pestana})}"></ul>
        <h2 class="h6">Anuncios y convocatorias</h2>
        <p th:if="${#lists.isEmpty(convocatorias)}" class="text-muted" th:text="#{publicaciones.vacio}">Vacío</p>
        <th:block th:each="convocatoria : ${convocatorias}">
            <article th:replace="~{fragments/socio :: convocatoria(${convocatoria})}"></article>
        </th:block>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
