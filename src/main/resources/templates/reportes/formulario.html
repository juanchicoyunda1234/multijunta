<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Gestionar comprobantes y emitir reportes</h1>
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="row g-3">
            <div class="col-12 col-lg-7">
                <form method="post" novalidate th:object="${reporteFormulario}" th:action="@{/reportes}" class="card card-body bg-white">
                    <div class="mb-3">
                        <label class="form-label" for="tipo">Tipo de reporte</label>
                        <select class="form-select" id="tipo" th:field="*{tipo}" th:errorclass="is-invalid">
                            <option th:each="opcion : ${tipos}" th:value="${opcion}" th:text="${opcion.etiqueta}">Tipo</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label" for="inicio">Fecha inicio</label>
                            <input type="date" class="form-control" id="inicio" th:field="*{inicio}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{inicio}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="fin">Fecha fin</label>
                            <input type="date" class="form-control" id="fin" th:field="*{fin}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fin}"></div>
                        </div>
                    </div>
                    <span class="form-label d-block">Formato de salida</span>
                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check" th:each="opcion : ${formatos}">
                            <input class="form-check-input" type="radio" th:field="*{formato}" th:value="${opcion}">
                            <label class="form-check-label" th:for="${#ids.prev('formato')}" th:text="${'Formato ' + opcion.etiqueta}">Formato</label>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap justify-content-end gap-2">
                        <button type="submit" class="btn btn-outline-dark" th:formaction="@{/reportes}" formmethod="get">Vista previa</button>
                        <button type="submit" class="btn btn-verde">Generar Reporte</button>
                    </div>
                </form>
            </div>
            <div class="col-12 col-lg-5">
                <section class="card card-body bg-white h-100">
                    <h2 class="h6">Vista previa</h2>
                    <p class="text-muted small mb-0" th:if="${previa == null and previaVacia == null}">
                        Elija el tipo y el rango y presione "Vista previa".</p>
                    <p class="mb-0" th:if="${previaVacia != null}" th:text="#{${previaVacia}}">Sin registros</p>
                    <div th:if="${previa != null}">
                        <p class="small text-muted mb-1" th:text="${previa.tipo.etiqueta + ' · ' + #lists.size(previa.filas) + ' registros'}">Resumen</p>
                        <p class="h5 mb-2" th:text="${previaTexto}">Saldo</p>
                        <ul class="list-unstyled small mb-0">
                            <li th:each="total : ${previa.totales}" class="d-flex justify-content-between border-bottom py-1">
                                <span th:text="${total.etiqueta}">Etiqueta</span>
                                <span class="monto"
                                      th:text="${(total.monto.signum() < 0 ? '-$' : '$') + #numbers.formatDecimal(total.monto.abs(), 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                            </li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
