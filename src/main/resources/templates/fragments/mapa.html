<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scripts">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const CENTRO_ECUADOR = [-1.24, -78.62];

        function crearMapa(id, opciones) {
            if (typeof L === 'undefined') {
                return null;
            }
            const mapa = L.map(id, opciones || {}).setView(CENTRO_ECUADOR, 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapa);
            return mapa;
        }

        document.querySelectorAll('.mapa-mini[data-lat]').forEach(function (elemento) {
            const punto = [parseFloat(elemento.dataset.lat), parseFloat(elemento.dataset.lng)];
            const mapa = crearMapa(elemento.id, {zoomControl: false, dragging: false, scrollWheelZoom: false,
                doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false});
            if (mapa) {
                mapa.setView(punto, 15);
                L.marker(punto).addTo(mapa);
            }
        });
    </script>
</th:block>
</body>
</html>
