<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · AquaTenant'">AquaTenant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="barra" class="barra-superior navbar bg-white border-bottom px-3 flex-wrap">
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-dark d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>
        <a class="navbar-brand fw-bold m-0" th:href="@{/inicio}">Aqua<span class="text-verde">Tenant</span></a>
        <img th:if="${logoJunta != null and logoJunta}" th:src="@{/logo/{id}(id=${sesion.juntaId})}"
             th:alt="'Logo de ' + ${sesion.juntaNombre}" class="logo-junta" id="logoJunta">
    </div>
    <div class="d-flex align-items-center gap-2" th:if="${sesion != null}">
        <div class="text-end small d-none d-md-block lh-sm">
            <div class="fw-semibold" th:text="${sesion.nombreCompleto}">Usuario</div>
            <div class="text-muted">
                <span th:text="${sesion.rol.etiqueta}">Rol</span><span th:if="${sesion.juntaNombre != null}"
                    th:text="' · ' + ${sesion.juntaNombre}"> · Junta</span>
            </div>
        </div>
        <a th:if="${puedeMensajes}" th:href="@{/mensajes}" class="btn btn-link text-dark position-relative"
           aria-label="Mensajes" id="enlaceMensajes">
            <i class="bi bi-chat-dots fs-5"></i>
            <span th:if="${mensajesNoLeidos > 0}" id="contadorMensajes"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:text="${mensajesNoLeidos}">0</span>
        </a>
        <a th:href="@{/notificaciones}" class="btn btn-link text-dark position-relative" aria-label="Notificaciones"
           id="enlaceNotificaciones">
            <i class="bi bi-bell fs-5"></i>
            <span th:if="${notificacionesNoLeidas > 0}" id="contadorNotificaciones"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:text="${notificacionesNoLeidas}">0</span>
        </a>
        <div class="dropdown">
            <button class="btn btn-outline-dark dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false" aria-label="Menú de usuario">
                <i class="bi bi-person-circle"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li class="dropdown-item-text small">
                    <div class="fw-semibold" th:text="${sesion.nombreCompleto}">Usuario</div>
                    <div th:text="${sesion.rol.etiqueta}">Rol</div>
                    <div class="text-muted" th:if="${sesion.juntaNombre != null}" th:text="${sesion.juntaNombre}">Junta</div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" th:href="@{/cuenta/cambiar-password}">Cambiar contraseña</a></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button class="dropdown-item" type="submit">Cerrar Sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
    <div class="w-100 d-md-none small lh-sm pt-1 text-truncate" th:if="${sesion != null}" id="datosSesionMovil">
        <span class="fw-semibold" th:text="${sesion.nombreCompleto}">Usuario</span>
        <span class="text-muted" th:text="' · ' + ${sesion.rol.etiqueta}"> · Rol</span><span class="text-muted"
            th:if="${sesion.juntaNombre != null}" th:text="' · ' + ${sesion.juntaNombre}"> · Junta</span>
    </div>
</header>

<nav th:fragment="menu" class="offcanvas-lg offcanvas-start menu-lateral border-end" tabindex="-1"
     id="menuLateral" aria-labelledby="menuLateralTitulo">
    <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5" id="menuLateralTitulo">Menú</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral"
                aria-label="Cerrar menú"></button>
    </div>
    <div class="offcanvas-body p-0">
        <ul class="nav flex-column w-100 py-2">
            <li class="nav-item" th:each="opcion : ${menu}">
                <a class="nav-link d-flex align-items-center gap-2" th:href="@{${opcion.ruta}}">
                    <i class="bi" th:classappend="${opcion.icono}"></i>
                    <span th:text="${opcion.menu}">Opción</span>
                </a>
            </li>
        </ul>
    </div>
</nav>

<ul th:fragment="pestanasUsuarios(activa)" class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link" th:classappend="${activa == 'socios'} ? 'active'" th:href="@{/usuarios/socios}">Socios</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:classappend="${activa == 'directiva'} ? 'active'" th:href="@{/usuarios/directiva}">Directiva</a>
    </li>
</ul>

<div th:fragment="mensajes">
    <div th:if="${exito != null}" class="alert alert-success" role="alert" th:text="#{${exito}}">Éxito</div>
    <div th:if="${exitoTexto != null}" class="alert alert-success" role="alert" th:text="${exitoTexto}">Éxito</div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="#{${error}}">Error</div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:if="${sesion != null}" th:inline="javascript">
        (function () {
            const rutaContadores = /*[[@{/contadores}]]*/ '/contadores';
            function pintar(enlaceId, contadorId, valor) {
                const enlace = document.getElementById(enlaceId);
                if (!enlace) {
                    return;
                }
                let contador = document.getElementById(contadorId);
                if (valor > 0) {
                    if (!contador) {
                        contador = document.createElement('span');
                        contador.id = contadorId;
                        contador.className = 'position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger';
                        enlace.appendChild(contador);
                    }
                    contador.textContent = valor;
                } else if (contador) {
                    contador.remove();
                }
            }
            setInterval(function () {
                fetch(rutaContadores, {credentials: 'same-origin', headers: {'Accept': 'application/json'}})
                    .then(function (respuesta) { return respuesta.ok ? respuesta.json() : null; })
                    .then(function (datos) {
                        if (datos) {
                            pintar('enlaceNotificaciones', 'contadorNotificaciones', datos.notificaciones);
                            pintar('enlaceMensajes', 'contadorMensajes', datos.mensajes);
                        }
                    });
            }, 15000);
        })();
    </script>
</th:block>
</body>
</html>
