<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi información')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <h1 class="h4 mb-3">Mi información</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="fs-5 mb-1">Bienvenido/a, <span class="fw-semibold" th:text="${sesion.nombreCompleto}">Usuario</span></p>
                <p class="text-muted mb-3">
                    <span th:text="${sesion.rol.etiqueta}">Rol</span><span th:if="${sesion.juntaNombre != null}" th:text="' · ' + ${sesion.juntaNombre}"> · Junta</span>
                </p>
                <p class="mb-0">Aquí podrás consultar tus datos, pagos, multas y asistencias. Esta sección estará disponible próximamente.</p>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
