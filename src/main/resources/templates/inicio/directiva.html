<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel de la directiva')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <h1 class="h4 mb-1">Panel de la directiva</h1>
        <p class="text-muted mb-3">
            Bienvenido/a, <span class="fw-semibold" th:text="${sesion.nombreCompleto}">Usuario</span>
            · <span th:text="${sesion.rol.etiqueta}">Rol</span>
        </p>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3">
            <div class="col" th:each="tarjeta : ${tarjetas}">
                <a class="card h-100 shadow-sm text-decoration-none text-dark tarjeta-panel" th:href="@{${tarjeta.ruta}}"
                   th:data-ruta="${tarjeta.ruta}">
                    <div class="card-body d-flex align-items-center gap-3">
                        <i class="bi fs-2 text-verde" th:classappend="${tarjeta.icono}"></i>
                        <div>
                            <div class="small text-muted" th:text="${tarjeta.titulo}">Título</div>
                            <div th:if="${tarjeta.valor != null}" class="fs-3 fw-bold" th:text="${tarjeta.valor}">0</div>
                            <div th:if="${tarjeta.monto != null}" class="fs-3 fw-bold"
                                 th:text="${(tarjeta.monto.signum() < 0 ? '-$' : '$') + #numbers.formatDecimal(tarjeta.monto.abs(), 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                            <div th:if="${tarjeta.valor == null and tarjeta.monto == null}" class="small fst-italic" th:text="#{panel.proximamente}">Disponible próximamente</div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
