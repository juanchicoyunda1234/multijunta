<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="d-lg-flex">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido flex-grow-1 p-3 p-md-4">
        <h1 class="h4 mb-3">Cambiar contraseña</h1>
        <div th:if="${obligado}" class="alert alert-warning" role="alert">
            Debes cambiar tu contraseña para continuar usando el sistema.
        </div>
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="card shadow-sm" style="max-width: 480px;">
            <div class="card-body">
                <form th:action="@{/cuenta/cambiar-password}" method="post">
                    <div class="mb-3">
                        <label for="actual" class="form-label">Contraseña actual</label>
                        <input type="password" id="actual" name="actual" class="form-control" required
                               autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="nueva" class="form-label">Nueva contraseña</label>
                        <input type="password" id="nueva" name="nueva" class="form-control" required
                               autocomplete="new-password" aria-describedby="reglaPassword">
                        <div id="reglaPassword" class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmacion" class="form-label">Confirmar nueva contraseña</label>
                        <input type="password" id="confirmacion" name="confirmacion" class="form-control" required
                               autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-verde">Guardar contraseña</button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
